capabilities:
  - Email
  - ReceiveEmail
  - SQL
actions:
  CheckTicket:
    SelectKnowledgeArticle:
      by: SelectKnowledgeArticle
      recordInCapability: false
    ReviewTicket:
      by: ReviewTicket
    RequestMoreData:
      by: Email
      to: issuer.email
      optional: true
      highlyVariant: true
      withMissingData: true
    checkProblemExists:
      by: SQL
  Approval:
    requestApproval:
      by: Email
      to: approval.to
      waitingFor: []
    receiveApproval:
      by: ReceiveEmail
      from: approval.to
      waitingFor:
        - requestApproval
  Resolve:
    checkIssueStillExists:
      by: SQL
    resolveTheIssue:
      by: SQL
      waitingFor:
        - checkIssueStillExists
    checkProblemResolved:
      by: SQL
  Close:
    requestClosure:
      by: Email
      to: issuer.email
      waitingFor: []
    agreeClosure:
      by: ReceiveEmail
      from: issuer.email
      waitingFor:
        - requestClosure
    closed:
      by: Ticket
      waitingFor:
        - agreeClosure
  Review:
    createKnowledgeArticle:
      by: CreateKnowledgeArticle
      recordInCapability: false
      optional: true
